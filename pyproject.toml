[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endfield-factory-compiler"
version = "0.4.4"
description = "An offline, data-driven factory synthesis, placement and routing prototype."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "xianyuekz" }
]
keywords = ["factory", "eda", "placement", "routing", "simulation", "game-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.scripts]
efc = "endfield_factory_compiler.cli:main"

[project.urls]
Homepage = "https://github.com/xianyuekz/endfield-factory-compiler"
Documentation = "https://github.com/xianyuekz/endfield-factory-compiler/tree/main/docs"
Issues = "https://github.com/xianyuekz/endfield-factory-compiler/issues"
Source = "https://github.com/xianyuekz/endfield-factory-compiler"

[tool.setuptools.packages.find]
where = ["src"]
